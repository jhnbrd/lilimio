worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # The server runs as nginx with a read-only root filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep redirects relative: the existing tunnel terminates public HTTPS.
        absolute_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Revalidate the application shell and install metadata after releases.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /sw.js {
            add_header Cache-Control "no-store" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }

        location ~ ^/workbox-[^/]+\.js$ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Vite gives these assets content-hashed filenames.
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Artwork and brand URLs are stable names, so allow future replacements.
        location ~ ^/(art|fonts|images)/ {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        # Missing static files must return 404, never the SPA's HTML shell.
        location ~* \.(js|css|json|webmanifest|png|webp|svg|ico|woff2?|map)$ {
            try_files $uri =404;
        }

        # React Router deep links and refreshes resolve to the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
